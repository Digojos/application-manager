services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-application_manager}
      MYSQL_USER: ${MYSQL_USER:-application_manager}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-application_manager_change_me}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - app_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-application_manager}:${MYSQL_PASSWORD:-application_manager_change_me}@db:3306/${MYSQL_DATABASE:-application_manager}
      AUTH_SECRET: ${AUTH_SECRET:-change_me_in_production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://portal-apps.com.br}
      NODE_ENV: production
      PORT: 3001
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_network
    command: sh -c "npx prisma migrate deploy && npm run start"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "8081:8080"
    volumes:
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - app_network

  certbot:
    image: certbot/certbot:latest
    profiles:
      - certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - app_network

volumes:
  mysql_data:

networks:
  app_network: